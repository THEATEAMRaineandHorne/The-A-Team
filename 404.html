<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Edita Andrijasevic</title>
  <meta name="robots" content="noindex, follow">
  <style>
    :root {
      --gold: #ffb200;
      --dark: #202020;
      --white: #ffffff;
      --charcoal: #4D4E50;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--dark);
      background: #f7f7f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .error-container {
      background: var(--white);
      max-width: 500px;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
      border: 1px solid #e8e2d7;
    }
    h1 {
      font-size: 64px;
      margin: 0 0 10px;
      color: var(--dark);
    }
    h2 {
      font-size: 24px;
      margin: 0 0 15px;
      color: var(--charcoal);
    }
    p {
      color: #555555;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gold);
      color: var(--dark);
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      font-size: 16px;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #e6a100;
    }
  </style>
</head>
<body>

  <div class="error-container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The link you clicked might be broken, or the page may have moved. Let's get you back to finding property advice in West Auckland.</p>
    <a href="https://peterandedita.co.nz" class="btn">Return to Homepage</a>
  </div>

</body>
</html>
